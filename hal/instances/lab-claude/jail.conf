.include "../jail.defaults.conf";

lab-claude {
  persist;
  path = "/hal/instances/lab-claude";
  ip4 = inherit;
  host.hostname = "${name}.p7x.dev";

  exec.prepare += "mkdir -p ${path}/hal/data/lab.git";
  mount += "/hal/data/patmaddox/lab.git ${path}/hal/data/lab.git nullfs ro 0 0";

  exec.prepare += "mkdir -p ${path}/hal/data/lab-inbox.git";
  mount += "/hal/data/claude/lab-inbox-old.git ${path}/hal/data/lab-inbox.git nullfs rw 0 0";

  allow.mount;
  allow.mount.devfs;
  allow.mount.fdescfs;
  allow.mount.procfs;
  allow.mount.linprocfs;
  allow.mount.linsysfs;
  allow.mount.tmpfs;

  # linux
  exec.prepare += "sysrc -f ${path}/etc/rc.conf linux_enable=\"YES\"";
  mount += "devfs     ${path}/compat/linux/dev     devfs     rw  0 0";
  mount += "tmpfs     ${path}/compat/linux/dev/shm tmpfs     rw,size=1g,mode=1777  0 0";
  mount += "fdescfs   ${path}/compat/linux/dev/fd  fdescfs   rw,linrdlnk 0 0";
  mount += "linprocfs ${path}/compat/linux/proc    linprocfs rw  0 0";
  mount += "linsysfs  ${path}/compat/linux/sys     linsysfs  rw  0 0";
}
