# Point the base system's FreeBSD-ports repository at the latest branch
# rather than quarterly.  pkg merges repositories by name, so only the
# url changes.  Installed in each jail as
# /usr/local/etc/pkg/repos/FreeBSD-ports.conf before any packages.
FreeBSD-ports: {
  url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest"
}
