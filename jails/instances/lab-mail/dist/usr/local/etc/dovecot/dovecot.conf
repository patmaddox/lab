# Dovecot for lab-mail; see spec.org.
#
# Dovecot holds the list, the mailboxes INBOX and Archive, and is the
# only program that writes it. It serves the list over IMAP on
# loopback, and takes posted mail from OpenSMTPD over LMTP on a socket
# inside the jail. Nothing else: no POP3 or submission.

protocols = imap lmtp
listen = 127.0.0.1

# Clients connect over loopback only, so there is no TLS.
ssl = no
disable_plaintext_auth = no

service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 2143
  }
  inet_listener imaps {
    port = 0
  }
}

# Only OpenSMTPD's delivery, which runs as vmail, may connect.
service lmtp {
  unix_listener lmtp {
    user = vmail
    group = vmail
    mode = 0600
  }
}

# The logins that may change the list must give the password in
# imap-users, and a wrong one fails: their names never reach the
# static passdb below. Every other user name logs in with any
# password, and the ACL lets it only read. A login added to imap-users
# must be added to username_filter and to dovecot-acl too.
passdb {
  driver = passwd-file
  args = scheme=BLF-CRYPT username_format=%Lu /data/secrets/imap-users
}

passdb {
  driver = static
  args = nopassword=y
  username_filter = !pat@p7x.dev !mbsync
}

# Every login, and every LMTP delivery, is the same user, vmail, which
# owns the maildir. INBOX, where LMTP delivers each post, is a folder
# of the maildir, so mbsync syncs it with Fastmail's. The indexes and
# the UID lists live in a directory of vmail's own.
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/data/mail/dovecot allow_all_users=yes
}

namespace inbox {
  inbox = yes
  separator = /

  mailbox Archive {
    special_use = \Archive
  }
}

mail_location = maildir:/data/mail/maildir:LAYOUT=fs:INBOX=/data/mail/maildir/INBOX:INDEX=/data/mail/dovecot/index:CONTROL=/data/mail/dovecot/control:VOLATILEDIR=/data/mail/dovecot/volatile

# The rights section of spec.org, in dovecot-acl. Only the global file
# counts, so nothing in the maildir can grant a right.
mail_plugins = acl

protocol imap {
  mail_plugins = $mail_plugins imap_acl
}

plugin {
  acl = vfile:/usr/local/etc/dovecot/dovecot-acl
  acl_globals_only = yes
}

# LMTP delivers each posted message to INBOX. The ACL governs IMAP
# logins, not delivery: only vmail can reach the LMTP socket. Dovecot
# adds Return-Path and Delivered-To, and no Received header of its
# own; OpenSMTPD's is enough.
lmtp_add_received_header = no
