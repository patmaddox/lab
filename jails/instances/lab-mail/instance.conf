# Members of mailcred can read the Fastmail credentials. vmail is
# Dovecot's mail user; it is left out so it cannot read them.
# README.org has the numeric ids the host side depends on.
readonly groups="
mailcred:15100
"

readonly users="
smtprelay:15101:15101:mailcred
mbsync:15102:15102:mailcred
vmail:15103:15103
"

readonly packages="
mail/dovecot
mail/isync
mail/smtprelay
textproc/jq
"
