lab-devel {
  persist;
  path = "/hal/instances/lab-devel";
  ip4 = inherit;
  host.hostname = "${name}.p7x.dev";

  exec.prepare += "mkdir -p ${path}/hal/data/lab.git";
  mount += "/hal/data/patmaddox/lab.git ${path}/hal/data/lab.git nullfs rw 0 0";

  exec.prepare += "mkdir -p ${path}/hal/data/lab-inbox.git";
  mount += "/hal/data/claude/lab-inbox-old.git ${path}/hal/data/lab-inbox.git nullfs ro 0 0";
}
