lab-devel {
  persist;
  path = "/jails/instances/lab-devel";
  ip4 = inherit;
  host.hostname = "${name}.p7x.dev";

  exec.prepare += "mkdir -p ${path}/data/lab.git";
  mount += "/jails/share/lab.git ${path}/data/lab.git nullfs rw 0 0";

  exec.prepare += "mkdir -p ${path}/data/lab-submissions.git";
  mount += "/jails/share/lab-submissions.git ${path}/data/lab-submissions.git nullfs ro 0 0";
}
