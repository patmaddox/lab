# The Vale config that repo-docs uses. Vale's built-in style checks
# for repeated words. Its spelling check flags most technical terms,
# so it is off, and codespell finds misspellings instead. The Plain
# style flags sentence faults. Its hits are warnings, because its
# patterns also match sound text.
StylesPath = styles
MinAlertLevel = warning

[*]
BasedOnStyles = Vale, Plain
Vale.Spelling = NO
