# Example TOML file

[package]
name = "example"
version = "1.0.0"
description = "Example TOML configuration"

[author]
name = "Alice"
email = "alice@example.com"

[dependencies]
foo = "1.0.0"
bar = "2.0.0"

[settings]
enabled = true
count = 42
