# Place these sections into the relevant nginx.conf or included files sections.

events {
	worker_connections  1024;
}

http {
	include       mime.types;
	# Allow gzipping js, css, log, svg and json files.
	gzip on;
	gzip_http_version 1.0;
	gzip_comp_level 6;
	gzip_proxied any;
	gzip_min_length  1100;
	gzip_buffers 16 8k;
	gzip_types text/plain text/css application/x-javascript text/xml application/xml application/xml+rss text/javascript image/gif image/jpeg image/png application/json image/svg+xml;

	types {
		text/plain                            log;
	}

        server {
                listen 80;
                server_name poudriere;
                return 307 https://$host.p7x.dev$request_uri;
        }

        server {
                listen 80;
                server_name poudriere.p7x.dev;
                return 307 https://$host$request_uri;
        }

	server {
		listen       443 ssl;
		server_name  poudriere.p7x.dev;
		root         /usr/local/share/poudriere/html;
		ssl_certificate poudriere.p7x.dev.cert.pem;
		ssl_certificate_key poudriere.p7x.dev.key.pem;

		# Allow caching static resources
		location ~* ^.+\.(jpg|jpeg|gif|png|ico|svg|woff|css|js|html)$ {
			add_header Cache-Control "public";
			expires 2d;
		}

		location /data {
			alias /usr/local/poudriere/data/logs/bulk;

			# Allow caching dynamic files but ensure they get rechecked
			location ~* ^.+\.(log|txz|tbz|bz2|gz)$ {
				add_header Cache-Control "public, must-revalidate, proxy-revalidate";
			}

			# Don't log json requests as they come in frequently and ensure
			# caching works as expected
			location ~* ^.+\.(json)$ {
				add_header Cache-Control "public, must-revalidate, proxy-revalidate";
				access_log off;
				log_not_found off;
			}

			# Allow indexing only in log dirs
			location ~ /data/?.*/(logs|latest-per-pkg)/ {
				autoindex on;
			}

			break;
		}

		location /pkg {
			autoindex on;
			alias /usr/local/poudriere/data/packages;
		}
	}
}
