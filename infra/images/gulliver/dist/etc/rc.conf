clear_tmp_enable="YES"
syslogd_flags="-ss"
sendmail_enable="NONE"
hostname="gulliver.p7x.dev"
ifconfig_re1="DHCP"
sshd_enable="YES"
ntpdate_enable="YES"
ntpd_enable="YES"
powerd_enable="YES"
# Set dumpdev to "AUTO" to enable crash dumps, "NO" to disable
dumpdev="AUTO"
zfs_enable="YES"
devmatch_blocklist="if_iwlwifi"
wlans_iwx0="wlan0"
ifconfig_wlan0="mode 11a ssid padillac_admin WPA DHCP"
dbus_enable="YES"
kld_list="amdgpu if_iwx"
#tailscaled_enable="YES"
gateway_enable="YES"
pf_enable="YES"
#ifconfig_bridge0_name="bhyves"
#ifconfig_bhyves="inet 192.168.4.1/24 up"
tailscaled_syslog_output_enable="YES"
