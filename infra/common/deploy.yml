---
- name: Create FreeBSD Boot Environment
  hosts: all
  become_method: doas
  gather_facts: true

  vars:
    cwd: "{{ lookup('env', 'PWD') }}"
    ninja_vars: "{{ dict(lookup('file', cwd + '/build.ninja') | regex_findall('(\\w+) = (.+)')) }}"
    host_name: "{{ ninja_vars.host_name }}"
    jail: "{{ ninja_vars.jail }}"
    version: "{{ ninja_vars.version }}"
    userland: "{{ ninja_vars.userland }}"
    kernel: "{{ ninja_vars.kernel }}"
    timezone: "{{ ninja_vars.timezone }}"
    sync_users: "{{ ninja_vars.users }}"
    sync_groups: "{{ ninja_vars.groups }}"
    be_name: "{{ host_name }}-{{ userland }}-{{ version }}"
    be_name_tmp: "{{ be_name }}-NEW"
    be_mount: "/tmp/be-{{ be_name_tmp }}"
    image_path: "{{ cwd }}/../../../ninja-out/infra/hosts/{{ host_name }}/{{ host_name }}.be.zfs"
    is_remote: "{{ inventory_hostname != 'localhost' }}"
    sync_pw_path: "{{ '/tmp/sync-pw' if is_remote else cwd + '/../../../src/sync-pw/sync-pw' }}"
    data_mtree_path: "{{ '/tmp/data.mtree' if is_remote else cwd + '/dist/data.mtree' }}"
    expected_snapshots:
      - "{{ host_name }}{{ jail }}"
      - config_base
      - users
      - data
      - ready

  tasks:
    - name: Check if boot environment already exists
      command: zfs list zroot/ROOT/{{ be_name }}
      register: be_exists_check
      failed_when: false
      changed_when: false
      become: true

    - name: Fail if boot environment already exists
      fail:
        msg: "Boot environment '{{ be_name }}' already exists. Use a different name or destroy the existing BE with: bectl destroy {{ be_name }}"
      when: be_exists_check.rc == 0

    - name: Check if temporary boot environment already exists
      command: zfs list zroot/ROOT/{{ be_name_tmp }}
      register: tmp_be_exists_check
      failed_when: false
      changed_when: false
      become: true

    - name: Import pre-built boot environment (remote)
      shell: cat {{ image_path }} | ssh {{ inventory_hostname }} "doas bectl import {{ be_name_tmp }}"
      delegate_to: localhost
      when: tmp_be_exists_check.rc != 0 and is_remote

    - name: Import pre-built boot environment (local)
      shell: bectl import {{ be_name_tmp }} < {{ image_path }}
      when: tmp_be_exists_check.rc != 0 and not is_remote
      become: true

    - name: Check if boot environment is already mounted
      command: zfs get -H -o value mounted zroot/ROOT/{{ be_name_tmp }}
      register: mount_check
      changed_when: false
      become: true

    - name: Mount boot environment for configuration
      command: bectl mount {{ be_name_tmp }} {{ be_mount }}
      when: mount_check.stdout == "no"
      changed_when: false
      become: true

    - name: Validate imported system version
      command: chroot "{{ be_mount }}" /bin/freebsd-version
      register: freebsd_version_check
      failed_when: false
      changed_when: false
      become: true

    - name: Fail if userland version mismatch
      fail:
        msg: "Userland version mismatch. Expected '{{ userland }}' but got '{{ freebsd_version_check.stdout }}'"
      when: freebsd_version_check.stdout != userland

    - name: Check if config_base snapshot exists
      command: zfs list -t snapshot zroot/ROOT/{{ be_name_tmp }}@config_base
      register: config_base_snapshot_check
      failed_when: false
      changed_when: false
      become: true

    - name: Copy dist directory to remote host
      copy:
        src: "{{ cwd }}/dist/"
        dest: "/tmp/dist/"
      when: config_base_snapshot_check.rc != 0 and is_remote

    - name: Extract configuration files to boot environment
      shell: tar -C {{ '/tmp/dist' if is_remote else cwd + '/dist' }} -c @dist.mtree | tar -C {{ be_mount }} -x
      when: config_base_snapshot_check.rc != 0
      become: true

    - name: Set timezone in boot environment
      command: tzsetup -C {{ be_mount }} {{ timezone }}
      when: config_base_snapshot_check.rc != 0
      become: true

    - name: Create config_base snapshot
      zfs:
        name: "zroot/ROOT/{{ be_name_tmp }}@config_base"
        state: present
      when: config_base_snapshot_check.rc != 0
      become: true

    - name: Check if users snapshot exists
      command: zfs list -t snapshot zroot/ROOT/{{ be_name_tmp }}@users
      register: users_snapshot_check
      failed_when: false
      changed_when: false
      become: true

    - name: Copy sync-pw tool to remote host
      copy:
        src: "{{ cwd }}/../../../src/sync-pw/sync-pw"
        dest: "/tmp/sync-pw"
        mode: '0755'
      when: users_snapshot_check.rc != 0 and is_remote

    - name: Sync users and groups from current BE
      shell: |
        for user in {{ sync_users }}; do
          {{ sync_pw_path }} /etc "{{ be_mount }}/etc" u $user
        done
        for group in {{ sync_groups }}; do
          {{ sync_pw_path }} /etc "{{ be_mount }}/etc" g $group
        done
      when: users_snapshot_check.rc != 0
      become: true

    - name: Create users snapshot
      zfs:
        name: "zroot/ROOT/{{ be_name_tmp }}@users"
        state: present
      when: users_snapshot_check.rc != 0
      become: true

    - name: Check if data snapshot exists
      command: zfs list -t snapshot zroot/ROOT/{{ be_name_tmp }}@data
      register: data_snapshot_check
      failed_when: false
      changed_when: false
      become: true

    - name: Copy data.mtree to remote host
      copy:
        src: "{{ cwd }}/dist/data.mtree"
        dest: "/tmp/data.mtree"
      when: data_snapshot_check.rc != 0 and is_remote

    - name: Copy data files using mtree manifest
      shell: tar -C / -c @{{ data_mtree_path }} | tar -C {{ be_mount }} -x
      when: data_snapshot_check.rc != 0
      become: true

    - name: Create data snapshot
      zfs:
        name: "zroot/ROOT/{{ be_name_tmp }}@data"
        state: present
      when: data_snapshot_check.rc != 0
      become: true

    - name: Create ready snapshot of completed boot environment
      zfs:
        name: "zroot/ROOT/{{ be_name_tmp }}@ready"
        state: present
      become: true

    - name: Validate snapshot order
      shell: |
        zfs list -t snap -H -s creation -o name zroot/ROOT/{{ be_name_tmp }} |
          sed -e 's|^zroot/ROOT/{{ be_name_tmp }}@||'
      register: final_snapshot_order
      changed_when: false
      failed_when: final_snapshot_order.stdout_lines != expected_snapshots
      ignore_errors: false
      become: true

    - name: Unmount boot environment
      command: bectl umount {{ be_name_tmp }}
      changed_when: false
      become: true

    - name: Report activation command
      debug:
        msg: |
          Boot environment {{ be_name_tmp }} has been created successfully.
          To temporarily activate it for the next boot, run:
            bectl activate -t {{ be_name_tmp }}
          Then reboot to test.
