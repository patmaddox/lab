# Boot environment for yolo, built by infra/scripts/pkgbase-be.sh.

name=yolo
abi=FreeBSD:15:amd64
base_url="pkg+https://pkg.FreeBSD.org/${abi}/base_release_1"
base_keys=/usr/share/keys/pkgbase-15
timezone=America/Los_Angeles

# yolo is a dev box, so it gets the whole base system: compilers and
# headers for building, bhyve, and jails for poudriere.
base_packages="
    FreeBSD-set-base
    FreeBSD-set-kernels
"

packages="
    pkg
    tmux
"

# Groups to create, with their gids.
groups="
patmaddox 1001
"

# master.passwd(5) lines, rendered with op inject. Each replaces the
# line for its user, or is appended. patmaddox has no password: *
# refuses password logins, but SSH keys still work. root has one for
# the console only.
users="
root:{{ op://Personal/yolo-secrets/passwd_root }}:0:0::0:0:Charlie &:/root:/bin/sh
patmaddox:*:1001:1001::0:0:Pat Maddox:/home/patmaddox:/bin/sh
"

# Groups and the users to add to each, as a comma-separated list. The
# members the base system and packages gave a group are kept.
group_members="
wheel patmaddox
"

# Files the image must contain.
required_files="
/boot/kernel/kernel
/boot/kernel/vmm.ko
/boot/loader.efi
/usr/bin/cc
/usr/libexec/dma
/usr/local/bin/tmux
/usr/local/sbin/pkg
/usr/sbin/bhyve
/usr/sbin/ntpd
/usr/sbin/sshd
"

# Commands run in the image that must succeed.
config_checks="
sh -n /etc/rc.conf
/usr/sbin/sshd -t
"
