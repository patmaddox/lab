# Boot environment for yolo, built by infra/scripts/pkgbase-be.sh.

name=yolo
release=15.1
timezone=America/Los_Angeles

# yolo is a dev box, so it gets the whole base system: compilers and
# headers for building, bhyve, and jails for poudriere.
base_packages="
    FreeBSD-set-base
    FreeBSD-set-kernels
"

packages="
    pkg
    tmux
"

# yolo's own packages, built in this tree. They live in /usr/local and
# /etc, which belong to the BE, so each new BE must carry them.
local_packages="
    src/yolo-jail/yolo-jail.pkg
    jails/yolo-jails.pkg
"

# Groups to create, with their gids.
groups="
patmaddox 1001
"

# master.passwd(5) lines. Each replaces the line for its user, or is
# appended. patmaddox has no password: * refuses password logins, but
# SSH keys still work. root's password, for the console only, comes
# from passwords.
users="
root:*:0:0::0:0:Charlie &:/root:/bin/sh
patmaddox:*:1001:1001::0:0:Pat Maddox:/home/patmaddox:/bin/sh
"

# Users and the 1Password references of their passwords, which are
# hashed into the image.
passwords="
root op://Personal/yolo-secrets/root_password
"

# Groups and the users to add to each, as a comma-separated list. The
# members the base system and packages gave a group are kept.
group_members="
wheel patmaddox
"

# Files the image must contain.
required_files="
/boot/kernel/kernel
/boot/kernel/vmm.ko
/boot/loader.efi
/usr/bin/cc
/usr/libexec/dma
/usr/local/bin/tmux
/usr/local/sbin/yolo-jail-template
/etc/jail.conf.d/lab-1.conf
/usr/local/sbin/pkg
/usr/sbin/bhyve
/usr/sbin/ntpd
/usr/sbin/sshd
"

# Commands run in the image that must succeed.
config_checks="
sh -n /etc/rc.conf
/usr/sbin/sshd -t
"
