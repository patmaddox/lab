# Template for jails that coding agents run in. The agent has doas, so
# it installs whatever else it needs. git is here because every jail
# clones its repo from /git. claude-code is the agent itself, which
# the template's settings configure. pkg and yolo-pkg-repos are here so
# the jail can upgrade itself from the repositories.

comment="Template for yolo's coding-agent jails"

packages="
pkg
yolo-pkg-repos
git
doas
claude-code
"

users="
agent:15000
"
