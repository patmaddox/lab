# Template for jails that coding agents run in. The agent has doas, so
# it installs whatever else it needs. git is here because every jail
# clones its repo from /git. claude-code is the agent itself, which
# the template's settings configure, and jq reads the JSON its hooks
# get. claude-repo-docs adds a managed skill for writing docs, and
# claude-revise-prose a skill and agent for placing a commit's prose.
# pkg and yolo-pkg-repos are here so the jail can upgrade itself
# from the repositories. FreeBSD-acpi holds iasl, which bhyve runs
# to build a VM's ACPI tables, and which FreeBSD-set-base-jail
# lacks. FreeBSD-tests and atf let the agent run kyua tests. The base
# set has kyua, but kyua's store schema ships only in FreeBSD-tests.
# atf puts atf-sh on PATH for test programs that start with
# "#!/usr/bin/env atf-sh", since base installs it in /usr/libexec.

comment="Template for yolo's coding-agent jails"

packages="
pkg
yolo-pkg-repos
git
doas
claude-code
claude-repo-docs
claude-revise-prose
jq
FreeBSD-acpi
FreeBSD-tests
atf
"

users="
agent:15000
"
