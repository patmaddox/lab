# Template for jails that coding agents run in. The agent has doas, so
# it installs whatever else it needs. git is here because every jail
# clones its repo from /git. claude-code is the agent itself, which
# the template's settings configure, and jq reads the JSON its hooks
# get. claude-repo-docs adds a managed skill for writing docs. pkg and
# yolo-pkg-repos are here so the jail can upgrade itself from the
# repositories. FreeBSD-acpi holds iasl, which bhyve runs to build a
# VM's ACPI tables, and which FreeBSD-set-base-jail lacks.

comment="Template for yolo's coding-agent jails"

packages="
pkg
yolo-pkg-repos
git
doas
claude-code
claude-repo-docs
jq
FreeBSD-acpi
"

users="
agent:15000
"
