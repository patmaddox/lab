# yolo routes a /24 to each jail over its epair. Drop packets whose
# source yolo would not route back out the interface they came in on,
# so a jail can send only from its own /24, and never as yolo, another
# jail, or a host beyond rowdy. Routes to a jail's /24 come and go with
# its epair, so this needs no rule per jail.
set skip on lo0

block in quick inet from urpf-failed
pass
