# System
hostname="yolo.p7x.dev"
zfs_enable="YES"
dumpdev="NO"
clear_tmp_enable="YES"
syslogd_flags="-ss"
sendmail_enable="NONE"

# Hardware: the Wi-Fi card brings a Bluetooth controller, which nothing
# here uses, and setting it up slows boot. Never load its driver.
devmatch_blocklist="ng_ubt"

# Network: cabled straight to rowdy's igb3, which owns 10.200.0.0/16
# for yolo and routes it nowhere but the internet. The address is on
# bridge0, with igc0 a member, so jails' epairs can join the bridge and
# sit on the /24 beside yolo.
cloned_interfaces="bridge0"
ifconfig_bridge0="inet 10.200.0.2/24 addm igc0 up"
ifconfig_igc0="up"
defaultrouter="10.200.0.1"

# Services
ntpdate_enable="YES"
ntpd_enable="YES"
sshd_enable="YES"
sshd_rsa_enable="NO"
