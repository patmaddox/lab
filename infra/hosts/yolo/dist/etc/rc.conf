# System
hostname="yolo.p7x.dev"
zfs_enable="YES"
dumpdev="NO"
clear_tmp_enable="YES"
syslogd_flags="-ss"
sendmail_enable="NONE"

# Hardware: the Wi-Fi card brings a Bluetooth controller, which nothing
# here uses, and setting it up slows boot. Never load its driver.
devmatch_blocklist="ng_ubt"

# Jails cannot load kernel modules, so load those they use that GENERIC
# does not build in: filesystems they may mount, nmdm for the consoles
# of their bhyve VMs, and if_bridge for their VMs' networks.
kld_list="fdescfs fusefs nullfs nmdm if_bridge"

# Network: cabled straight to rowdy's igb3, which routes all of
# 10.200.0.0/16 to yolo and lets it reach the internet and nothing
# else. 10.200.0.0/24 is the link between them. yolo routes a /24 of
# its own to each jail, over the jail's epair, and pf drops what a
# jail sends from addresses not its own.
ifconfig_igc0="inet 10.200.0.2/24"
defaultrouter="10.200.0.1"
gateway_enable="YES"
pf_enable="YES"

# Services
ntpdate_enable="YES"
ntpd_enable="YES"
sshd_enable="YES"
sshd_rsa_enable="NO"
