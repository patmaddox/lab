# Hide other users' and jails' processes
security.bsd.see_other_uids=0
security.bsd.see_other_gids=0
security.bsd.see_jail_proc=0
security.bsd.unprivileged_read_msgbuf=0

# Address space and PID randomization
kern.randompid=1
kern.elf32.aslr.enable=1
kern.elf32.aslr.pie_enable=1
kern.elf32.aslr.honor_sbrk=0
kern.elf64.aslr.enable=1
kern.elf64.aslr.pie_enable=1
kern.elf64.aslr.honor_sbrk=0

# ZFS
vfs.zfs.vdev.min_auto_ashift=12

# A jail is chrooted, and chroot(2) refuses a chrooted process that
# holds a directory open. podman, in a jail, chroots with directories
# open to unpack images, so let it. chroot(2) cannot reach above a
# jail's root, so the jail stays the boundary.
kern.chroot_allow_open_directories=2
