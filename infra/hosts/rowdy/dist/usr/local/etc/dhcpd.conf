option subnet-mask 255.255.255.0;
default-lease-time 600;
max-lease-time 7200;

# admin
subnet 172.21.1.1 netmask 255.255.255.0 {
  range 172.21.1.100 172.21.1.250;
  option routers 172.21.1.1;
  option domain-name-servers 172.21.1.1;
  option domain-name "p7x.dev";
}

