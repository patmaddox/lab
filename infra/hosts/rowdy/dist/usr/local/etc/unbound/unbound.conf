server:
	# Listen on the router's address in each network
	interface: 127.0.0.1
	interface: 172.21.1.1
	interface: 10.10.0.1
	interface: 10.20.0.1
	interface: 10.30.0.1
	interface: 10.99.0.1
	interface: 10.123.0.1

	# Answer every inside network and WireGuard
	access-control: 172.21.1.0/24 allow
	access-control: 172.22.1.0/24 allow
	access-control: 10.10.0.0/24 allow
	access-control: 10.20.0.0/24 allow
	access-control: 10.30.0.0/24 allow
	access-control: 10.99.0.0/24 allow
	access-control: 10.123.0.0/24 allow

	# Strip private addresses from public answers, so an outside name
	# cannot be rebound to a host inside
	private-address: 127.0.0.0/8
	private-address: 10.0.0.0/8
	private-address: 172.16.0.0/12
	private-address: 192.168.0.0/16
	private-address: 169.254.0.0/16
	private-address: ::1/128
	private-address: fd00::/8
	private-address: fe80::/10

	# Local hosts
	local-zone: "p7x.dev." static
	local-data: "rowdy.p7x.dev. IN A 10.10.0.1"
	local-data: "beastie.p7x.dev. IN A 10.10.0.2"
	local-data-ptr: "10.10.0.2 beastie.p7x.dev."
	local-data: "andre.p7x.dev. IN A 10.20.0.2"
	local-data: "andre-ilo.p7x.dev. IN A 10.99.0.5"
	local-data: "poudriere.p7x.dev. IN A 10.20.0.3"
	local-data: "devbsd.p7x.dev. IN A 10.20.0.4"
	local-data: "nixos.p7x.dev. IN A 172.21.1.34"
	local-data: "yolo.p7x.dev. IN A 10.200.0.2"
