# System
hostname="rowdy.p7x.dev"
zfs_enable="YES"
dumpdev="AUTO"
clear_tmp_enable="YES"
syslogd_flags="-ss"
sendmail_enable="NONE"

# Upstream: DHCP from the ISP
ifconfig_igb0="SYNCDHCP"
#ifconfig_igb0_ipv6="inet6 accept_rtadv"
#ifconfig_igb0_ipv6="DHCP"
#rtsold_enable="YES"

# Inside: admin network untagged, the rest on VLANs
ifconfig_igb1="inet 172.21.1.1/24"
vlans_igb1="10 20 30 99 123"
ifconfig_igb1_10="inet 10.10.0.1/24"	# workstations
ifconfig_igb1_20="inet 10.20.0.1/24"	# servers
ifconfig_igb1_30="inet 10.30.0.1/24"	# media
ifconfig_igb1_99="inet 10.99.0.1/24"	# management
ifconfig_igb1_123="inet 10.123.0.1/24"	# guest

# WireGuard; start_if.wg0 loads its key and peers
cloned_interfaces="wg0"
ifconfig_wg0="inet 172.22.1.1/24 mtu 1420 up"

# Routing and firewall
gateway_enable="YES"
pf_enable="YES"

# Network services
dhcpd_enable="YES"
dhcpd_flags="igb1 igb1.10 igb1.30 igb1.123"
unbound_enable="YES"
ntpdate_enable="YES"
ntpd_enable="YES"
sshd_enable="YES"
sshd_rsa_enable="NO"
