# Boot environment for rowdy, built by infra/scripts/pkgbase-be.sh.

name=rowdy
abi=FreeBSD:15:amd64
base_url="pkg+https://pkg.FreeBSD.org/${abi}/base_release_1"
base_keys=/usr/share/keys/pkgbase-15
timezone=America/Los_Angeles

# set-minimal covers rc, dhclient, zfs, syslogd, cron, and wg. The rest
# are what rc.conf turns on beyond that, plus a local mailer so periodic
# output reaches root.
base_packages="
    FreeBSD-set-minimal
    FreeBSD-set-kernels
    FreeBSD-dma
    FreeBSD-ntp
    FreeBSD-openssl-lib
    FreeBSD-pf
    FreeBSD-ssh
"

packages="
    dhcpd
    pkg
    tmux
    unbound
"

# Groups to create, with their gids.
groups="
patmaddox 1001
"

# master.passwd(5) lines, rendered with op inject. Each replaces the
# line for its user, or is appended. The passwords come from passwords.
users="
root:*:0:0::0:0:Charlie &:/root:/bin/sh
patmaddox:*:1001:1001::0:0:Pat Maddox:/home/patmaddox:/bin/sh
"

# Users and the 1Password references of their passwords, which are
# hashed into the image.
passwords="
root op://Personal/rowdy-secrets/root_password
patmaddox op://Personal/rowdy-secrets/patmaddox_password
"

# Groups and the users to add to each, as a comma-separated list. The
# members the base system and packages gave a group are kept.
group_members="
wheel patmaddox
"

# Files the image must contain.
required_files="
/boot/kernel/kernel
/boot/loader.efi
/sbin/pfctl
/usr/bin/wg
/usr/libexec/dma
/usr/local/bin/tmux
/usr/local/sbin/dhcpd
/usr/local/sbin/pkg
/usr/local/sbin/unbound
/usr/sbin/ntpd
/usr/sbin/sshd
"

# Commands run in the image that must succeed.
config_checks="
sh -n /etc/rc.conf
sh -n /etc/start_if.wg0
/sbin/pfctl -nf /etc/pf.conf
/usr/sbin/sshd -t
/usr/local/sbin/unbound-checkconf
/usr/local/sbin/dhcpd -n -c /usr/local/etc/dhcpd.conf
"
