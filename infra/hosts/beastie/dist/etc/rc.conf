hostname="beastie.p7x.dev"
defaultrouter="172.21.1.1"
cloned_interfaces="bridge0"

ifconfig_em0="up"
ifconfig_bridge0_name="jails"
ifconfig_jails="inet 172.21.1.30/24 addm em0 up"

dumpdev="AUTO"
keymap="us.ctrl"
kld_list="amdgpu"
syslogd_flags="-ss"

# base services
clear_tmp_enable="YES"
gateway_enable="YES"
ip6addrctl_enable="NO"
linux_enable="YES"
moused_enable="YES"
ntpd_enable="YES"
ntpdate_enable="YES"
pf_enable="YES"
sshd_enable="YES"
zfs_enable="YES"

# NFS
mountd_enable="YES"
nfs_server_enable="YES"
rpc_lockd_enable="YES"
rpc_statd_enable="YES"
rpcbind_enable="YES"

mountd_flags="-r -S -p 996"
rpc_lockd_flags="-p 4045"

nfs_server_maxio=1048576

# pkg services
dbus_enable="YES"
nginx_enable="YES"
postgresql_enable="YES"

vm_enable="YES"
vm_dir="zfs:zroot/VM"

# webcam
webcamd_enable="NO"
webcamd_0_flags="-N Insta360-Insta360-Link -S unknown -M 0"
