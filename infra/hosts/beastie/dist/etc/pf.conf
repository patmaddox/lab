ext_if = "em0"
bridge_if = "jails"
jail_net = "192.168.1.0/24"
ts_net = "100.64.0.0/10"
beastie = "172.21.1.30"
andre = "172.21.1.31"
poudriere = "172.21.1.32"
docker = "172.21.1.40"
devbsd = "172.21.1.33"
nixos = "172.21.1.34"

nfs_clients = "{" $beastie $andre $poudriere $docker $devbsd $nixos "}"

nfs = "2049"
mountd = "996"
rpcbind = "111"
rpc_statd = "613"
lockd = "4045"

set skip on lo
scrub in

nat on $bridge_if from $jail_net -> ($bridge_if:0)

#pass quick # for testing

pass out
block in

pass in inet proto icmp icmp-type { echoreq }

pass in proto tcp to port { ssh, http, 4000 }
pass in proto udp to port { 5353 }

pass in proto tcp from { $nfs_clients } to port { $nfs, $mountd, $rpcbind, $lockd }
pass in proto udp from { $nfs_clients } to port { $mountd, $rpcbind, $lockd }

pass from $jail_net
pass from $ts_net
pass to $ts_net
