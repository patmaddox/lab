archie {
  $iface = "$name";
  path = "/jails/$name";
  vnet;
  vnet.interface = "${iface}b";

  host.hostname = "$name";
  mount.devfs;
  enforce_statfs = 1;
  devfs_ruleset = 6;
  #children.max = 40;
  #allow.sysvipc; # replace with per-module params
  allow.mount;
  #allow.mount.devfs;
  allow.mount.nullfs;
  #allow.mount.procfs;
  allow.mount.tmpfs;
  allow.mount.zfs;
  exec.clean;
  exec.prepare = "~patmaddox/oldbin/jlprep $name $iface";
  #exec.created = "zfs jail $name zroot/JAILS/${name}/zdata";
  exec.start = "sh /etc/rc";
  exec.stop = "sh /etc/rc.shutdown jail";
  exec.release = "ifconfig ${iface}a destroy";
}
