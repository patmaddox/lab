rxv-pg-primary {
  $ip = "192.168.1.2";
  $zdata = "zroot/jails/data/${name}";
  host.hostname = ${name};
  ip4.addr = ${ip};
  path = "/jails/instances/${name}";
  persist;

  exec.prepare = "ifconfig jails alias ${ip}/24";
  exec.created = "zfs jail ${name} ${zdata}";
  exec.created += "zfs set jailed=on ${zdata}";
  exec.poststop += "zfs unjail ${name} ${zdata}";

  allow.mount;
  allow.mount.zfs;

  sysvmsg=new;
  sysvsem=new;
  sysvshm=new;
}

