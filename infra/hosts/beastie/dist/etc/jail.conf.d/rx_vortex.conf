rxv-build {
  $ip = "192.168.1.6";
  host.hostname = ${name};
  ip4.addr = ${ip};
  path = "/jails/instances/${name}";
  persist;

  exec.prepare = "ifconfig jails alias ${ip}/24";

  allow.mount;

  # linux stuff
  allow.mount.devfs;
  allow.mount.fdescfs;
  allow.mount.procfs;
  allow.mount.linprocfs;
  allow.mount.linsysfs;
  allow.mount.tmpfs;
  mount.devfs;
  devfs_ruleset = 4;
  enforce_statfs = 1;
}

